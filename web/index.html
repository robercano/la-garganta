<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>La Garganta</title>
<style>
  :root { --fg: #f2b04a; --dim: #9a6a24; --bg: #120c05; --me: #e8d9b0; --sys: #7d5a2b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: flex; justify-content: center; font-family: "IBM Plex Mono", "Courier New", ui-monospace, monospace; color: var(--fg); }
  .crt { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 820px; height: 100dvh; background: radial-gradient(ellipse at center, #1c1307 0%, var(--bg) 70%, #070402 100%); overflow: hidden; }
  .crt::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  #bar { padding: 8px 14px; font-size: 12px; letter-spacing: .03em; color: var(--bg); background: var(--fg); text-transform: uppercase; line-height: 1.4; transition: background .6s; }
  #bar[data-corr="25"] { background: #c98a3a; }
  #bar[data-corr="50"] { background: #9c5a3a; color: #f5e6c8; }
  #bar[data-corr="75"] { background: #6e2a2a; color: #f5e6c8; }
  #out { flex: 1; overflow-y: auto; padding: 14px 16px 8px; font-size: 15px; line-height: 1.5; text-shadow: 0 0 6px rgba(242,176,74,.45); }
  #out p { margin: 0 0 .85em; white-space: pre-wrap; animation: in .25s ease-out; }
  #out p.me { color: var(--me); margin-top: 1.2em; text-shadow: none; }
  #out p.sys { color: var(--sys); text-shadow: none; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px; border-top: 1px solid #3a2810; }
  .keys button { flex: 1 0 auto; min-width: 44px; padding: 8px 6px; font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--dim); border-radius: 2px; cursor: pointer; }
  .keys button:active { background: var(--fg); color: var(--bg); }
  form { display: flex; align-items: center; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #3a2810; }
  form span { color: var(--fg); }
  #cmd { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent; border: 0; outline: 0; caret-color: var(--fg); }
  #cmd::placeholder { color: var(--dim); }
</style>
</head>
<body>
<div class="crt">
  <div id="bar">…</div>
  <div id="out" aria-live="polite"></div>
  <div class="keys">
    <button data-cmd="n">N</button><button data-cmd="s">S</button><button data-cmd="e">E</button><button data-cmd="o">O</button>
    <button data-cmd="subir">↑</button><button data-cmd="bajar">↓</button>
    <button data-cmd="mirar">mirar</button><button data-cmd="i">inv</button><button data-cmd="estado">estado</button>
  </div>
  <form id="form" autocomplete="off"><span>&gt;</span><input id="cmd" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Comando"></form>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
